name: Build Pocket Pet 96 v8 APK
on:
  push:
    branches: [tamagotchi-android]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Expand v8 source
        run: |
          test -s source_v8.tar.xz.b64
          base64 -d source_v8.tar.xz.b64 | tar -xJf -
          test -f app/src/main/java/ru/pgws/pocketpet/Lessons.java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Obtain original LCD5x8H font
        run: |
          mkdir -p app/src/main/assets
          curl -fLsS --connect-timeout 12 --max-time 45 'https://www.ubasics.com/mcgahee/LCDTTF.ZIP' -o /tmp/LCDTTF.ZIP || true
          if unzip -tq /tmp/LCDTTF.ZIP >/dev/null 2>&1; then
            mkdir -p /tmp/pet-font
            unzip -jo /tmp/LCDTTF.ZIP -d /tmp/pet-font
            find /tmp/pet-font -iname '*.ttf' -print -quit | xargs -r -I{} cp '{}' app/src/main/assets/LCD5x8H.ttf
          fi
          if [ ! -s app/src/main/assets/LCD5x8H.ttf ]; then
            curl -fLsS --retry 3 'https://db.onlinewebfonts.com/t/b18184281842de0a7e3535f9ed379a40.ttf' -o app/src/main/assets/LCD5x8H.ttf
          fi
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/LCD5x8H.ttf')
          b=p.read_bytes()
          if len(b)<8000 or b[:4] not in (b'\x00\x01\x00\x00', b'OTTO', b'ttcf'):
              raise SystemExit('Invalid LCD5x8H font')
          print('LCD5x8H bytes:',len(b))
          PY
      - name: Unit and regression tests
        run: |
          mkdir -p /tmp/pet-tests
          javac -encoding UTF-8 -d /tmp/pet-tests \
            app/src/main/java/ru/pgws/pocketpet/PetGame.java \
            app/src/main/java/ru/pgws/pocketpet/PetSprites.java \
            app/src/main/java/ru/pgws/pocketpet/MiniGames.java \
            app/src/main/java/ru/pgws/pocketpet/TouchRegions.java \
            app/src/main/java/ru/pgws/pocketpet/Lessons.java \
            localtest/TestPets.java localtest/TestMiniGames.java \
            localtest/TestLifecycle.java localtest/TestInteractionV7.java \
            localtest/TestLessons.java
          java -cp /tmp/pet-tests TestPets
          java -cp /tmp/pet-tests TestMiniGames
          java -cp /tmp/pet-tests TestLifecycle
          java -cp /tmp/pet-tests TestInteractionV7
          java -cp /tmp/pet-tests TestLessons
      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Inspect output
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          unzip -t app/build/outputs/apk/release/app-release.apk | tail -1
          sha256sum app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PocketPet96-v8-LCD-Android-4.4plus
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
