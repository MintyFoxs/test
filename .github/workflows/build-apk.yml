name: Build Pocket Pet 96 APK
on:
  push:
    branches:
      - tamagotchi-android
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Use committed Android project
        run: |
          test -f app/build.gradle
          test -f app/src/main/java/ru/pgws/pocketpet/PetView.java
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android 16 platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Assemble installable signed APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Verify APK exists
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          sha256sum app/build/outputs/apk/release/app-release.apk
      - name: Publish APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketPet96-Touch-v2-Android-4.4-to-17
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
      - name: Expose readable source files
        continue-on-error: true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .gitignore settings.gradle build.gradle gradle.properties app/
          git diff --cached --quiet || (git commit -m 'Add readable Android application source' && git push origin HEAD:tamagotchi-android)
