name: Build Android APK v5
on:
  push:
    branches: [tamagotchi-android]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Expand project source bundle
        run: |
          base64 -d source_bundle_v5.tar.xz.b64 | tar xJ
          test -f app/src/main/java/ru/pgws/pocketpet/PixelFont.java
          test -s app/src/main/res/drawable-nodpi/pixel_font.png
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Test 1000 cute pets and randomized mini-games
        run: |
          mkdir -p /tmp/pet-tests
          javac -encoding UTF-8 -d /tmp/pet-tests app/src/main/java/ru/pgws/pocketpet/PetGame.java app/src/main/java/ru/pgws/pocketpet/PetSprites.java app/src/main/java/ru/pgws/pocketpet/MiniGames.java localtest/TestPets.java localtest/TestMiniGames.java
          java -cp /tmp/pet-tests TestPets
          java -cp /tmp/pet-tests TestMiniGames
      - name: Compile signed installable APK
        run: gradle :app:assembleRelease --stacktrace --no-daemon
      - name: APK checksum
        run: sha256sum app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PocketPet96-Touch-v5-Android-4.4plus
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
      - name: Publish readable project sources
        continue-on-error: true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .gitignore build.gradle settings.gradle gradle.properties app localtest
          if ! git diff --cached --quiet; then
            git commit -m 'Publish v5 readable source [skip ci]'
            git push origin HEAD:tamagotchi-android
          fi
