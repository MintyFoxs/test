name: Build Pocket Pet 96 v7 (navigation fix)
on:
  push:
    branches: [tamagotchi-android]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Expand v7 source
        run: |
          test -s source_v7.tar.xz.b64
          base64 -d source_v7.tar.xz.b64 | tar -xJf -
          test -f app/src/main/java/ru/pgws/pocketpet/TouchRegions.java
          # Hotfix the double-dispatch: opening the treatment scene must not
          # immediately invoke its newly visible BACK button in the same UP event.
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/ru/pgws/pocketpet/PetView.java')
          s=p.read_text()
          a='        boolean did=false;\n        if(action==MotionEvent.ACTION_CANCEL)'
          b='        int originalScreen=screen; // Capture the scene where the touch began.\n        boolean did=false;\n        if(action==MotionEvent.ACTION_CANCEL)'
          c='if(y>=693&&y<766&&screen!=0)'
          d='if(originalScreen!=0&&y>=693&&y<766&&screen!=0)'
          if a not in s or c not in s: raise SystemExit('Touch fix preconditions not met')
          p.write_text(s.replace(a,b,1).replace(c,d,1))
          print('Treatment navigation double-dispatch fixed')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Download 8BIT WONDER RUS for personal-use build
        run: |
          mkdir -p app/src/main/assets
          curl -fLsS --retry 3 --retry-delay 3 'https://db.onlinewebfonts.com/t/e844e1db9d25590da3283ed203b03f86.ttf' -o app/src/main/assets/EightBitWonderRus.ttf
          python3 - <<'PY'
          from pathlib import Path
          f=Path('app/src/main/assets/EightBitWonderRus.ttf')
          if f.stat().st_size < 12000 or f.read_bytes()[:4] not in (b'\x00\x01\x00\x00', b'OTTO', b'ttcf'):
              raise SystemExit('Font download was not a usable TTF')
          print('8BIT WONDER RUS TTF verified; bytes', f.stat().st_size)
          PY
          curl --fail --location --retry 3 'https://raw.githubusercontent.com/google/fonts/main/ofl/pixelifysans/PixelifySans%5Bwght%5D.ttf' --output app/src/main/assets/PixelifySans.ttf
      - name: Test aging, care and 1000 variants
        run: |
          mkdir -p /tmp/pet-tests
          javac -encoding UTF-8 -d /tmp/pet-tests app/src/main/java/ru/pgws/pocketpet/PetGame.java app/src/main/java/ru/pgws/pocketpet/PetSprites.java app/src/main/java/ru/pgws/pocketpet/MiniGames.java app/src/main/java/ru/pgws/pocketpet/TouchRegions.java localtest/TestPets.java localtest/TestMiniGames.java localtest/TestLifecycle.java localtest/TestInteractionV7.java
          java -cp /tmp/pet-tests TestPets
          java -cp /tmp/pet-tests TestMiniGames
          java -cp /tmp/pet-tests TestLifecycle
          java -cp /tmp/pet-tests TestInteractionV7
      - name: Compile signed APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          sha256sum app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PocketPet96-Touch-v7.0.0-Android-4.4plus
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
