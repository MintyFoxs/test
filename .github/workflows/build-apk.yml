name: Build Android APK
on:
  push:
    branches: [tamagotchi-android]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify 1000 distinct sprites and egg randomization
        run: |
          mkdir -p /tmp/pet-tests
          javac -d /tmp/pet-tests app/src/main/java/ru/pgws/pocketpet/PetGame.java app/src/main/java/ru/pgws/pocketpet/PetSprites.java localtest/TestPets.java
          java -cp /tmp/pet-tests TestPets
      - name: Compile signed installable APK
        run: gradle :app:assembleRelease --stacktrace --no-daemon
      - name: APK checksum
        run: sha256sum app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PocketPet96-Android-4.4-to-17
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
