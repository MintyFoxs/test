name: Pocket Pet 96 v8.5.5 lifespan and one-pet restoration (unsigned verification)
on:
  pull_request:
    branches: [tamagotchi-android]
    paths:
      - 'tools/patch_v855.py'
      - 'tools/TestLifetimeFix.java'
      - '.github/workflows/build-v855.yml'
  push:
    branches: [tamagotchi-android]
    paths:
      - 'tools/patch_v855.py'
      - 'tools/TestLifetimeFix.java'
      - '.github/workflows/build-v855.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Reconstitute v8.5.4 source
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode source_v84.tar.xz.b64 | tar -xJf -
          base64 --decode source_patch_v85.tar.xz.b64 | tar -xJf - --strip-components=1
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/ru/pgws/pocketpet/MainActivity.java')
          s=p.read_text(encoding='utf-8')
          p.write_text(s.replace('IP.'+chr(10)+'ПРАВИЛА','IP.'+chr(92)+'n'+'ПРАВИЛА'),encoding='utf-8')
          PY
          python3 tools/patch_v851.py
          python3 tools/patch_v852.py
          python3 tools/patch_v853.py
          python3 tools/patch_v854.py
      - name: Apply life fix, snapshot migration and version verification
        run: |
          set -euo pipefail
          python3 tools/patch_v855.py
          grep -q 'versionCode 15' app/build.gradle
          grep -q "versionName '8.5.5-hotfix'" app/build.gradle
          grep -q "applicationId 'ru.pgws.pocketpet'" app/build.gradle
          grep -q 'restoreOnePetOnce' app/src/main/java/ru/pgws/pocketpet/MainActivity.java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Run original tests and lifetime regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pet-tests
          javac -encoding UTF-8 -d /tmp/pet-tests \
            app/src/main/java/ru/pgws/pocketpet/{PetGame,PetSprites,MiniGames,TouchRegions,Lessons}.java \
            localtest/*.java tools/TestLifetimeFix.java
          for t in TestPets TestMiniGames TestLifecycle TestInteractionV7 TestLessons TestLifetimeFix; do
            java -cp /tmp/pet-tests "$t"
          done
      - name: Assemble unsigned test APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Verify unsigned APK only (NOT v8.9.x OTA)
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$apk"
          unzip -tq "$apk"
          sha256sum "$apk"
      - uses: actions/upload-artifact@v4
        with:
          name: PocketPet96-v8.5.5-hotfix-unsigned-NOT-OTA
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 14
