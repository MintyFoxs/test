name: PhotoRevive Android APK
on:
  push:
    branches: [photorevive-android]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and extract app source
        run: |
          base64 -d source.b64 > source.br
          echo "128fee861cd6f253b7c4806d410c098d0cc2b6d3c76bdae0db0cc712c575e9e8  source.br" | sha256sum -c -
          python3 -m pip install --quiet brotli
          python3 - <<'PY'
          import brotli
          from pathlib import Path
          Path("source.tar").write_bytes(brotli.decompress(Path("source.br").read_bytes()))
          PY
          mkdir -p photoapp
          tar -xf source.tar -C photoapp
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Unit tests
        working-directory: photoapp
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build APK
        working-directory: photoapp
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoRevive-Android-APK
          path: photoapp/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
