name: Export Android APK Signing Tool
on:
  push:
    branches: [tamagotchi-android]
    paths: ['.github/workflows/export-apksigner.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install build tools
        run: sdkmanager 'build-tools;36.0.0'
      - name: Copy verification and signing tools
        run: |
          set -eu
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" .
          test -s apksigner.jar
          java -jar apksigner.jar --version
      - uses: actions/upload-artifact@v4
        with:
          name: android-apksigner-tool
          path: apksigner.jar
          retention-days: 7
