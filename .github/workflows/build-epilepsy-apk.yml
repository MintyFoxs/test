name: Build Pocket Pet 96 - Epilepsy Sans
on:
  push:
    branches: [tamagotchi-android]
    paths:
      - '.github/workflows/build-epilepsy-apk.yml'
      - 'tools/apply_epilepsy_font.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Expand verified v8 source
        run: |
          set -euo pipefail
          test -s source_v8.tar.xz.b64
          base64 -d source_v8.tar.xz.b64 | tar -xJf -
          test -f app/src/main/java/ru/pgws/pocketpet/PixelFont.java
          test -f tools/apply_epilepsy_font.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Get original Epilepsy Sans; preserve author's license
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          cp tools/EpilepsySans-LICENSE.txt app/src/main/assets/EpilepsySans-LICENSE.txt
          # The author's server may respond 406 to CI; use its unmodified TTF from a mirror.
          if curl --fail --location --silent --show-error --retry 1 --connect-timeout 8 --max-time 35 \
            'https://www.kreativekorp.com/swdownload/fonts/relaybm/epilepsy.zip' -o /tmp/epilepsy.zip; then
            unzip -tq /tmp/epilepsy.zip
            python3 - <<'PY'
          import zipfile, pathlib
          dst=pathlib.Path('app/src/main/assets')
          with zipfile.ZipFile('/tmp/epilepsy.zip') as z:
              matches=[n for n in z.namelist() if pathlib.PurePosixPath(n).name.lower()=='epilepsysans.ttf']
              if len(matches)!=1: raise RuntimeError(f'Expected EpilepsySans.ttf: got {z.namelist()}')
              (dst/'EpilepsySans.ttf').write_bytes(z.read(matches[0]))
          PY
          else
            curl --fail --location --silent --show-error --retry 3 --connect-timeout 15 --max-time 120 \
              'https://db.onlinewebfonts.com/t/0d7b038fb3ce1e579d48372b7daf1172.ttf' \
              -o app/src/main/assets/EpilepsySans.ttf
          fi
          python3 - <<'PY'
          from pathlib import Path
          b=Path('app/src/main/assets/EpilepsySans.ttf').read_bytes()
          if len(b)<8000 or b[:4] not in (bytes((0,1,0,0)),b'OTTO',b'ttcf'):
              raise RuntimeError('Downloaded file is not a TrueType/OpenType font')
          print('Original EpilepsySans.ttf size:',len(b),'bytes')
          PY
          grep -q 'RELAY FONTS FREE USE LICENSE' app/src/main/assets/EpilepsySans-LICENSE.txt
      - name: Verify Cyrillic and Latin glyphs
        run: |
          python3 -m pip install --quiet fonttools
          python3 - <<'PY'
          from fontTools.ttLib import TTFont
          from pathlib import Path
          required='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789АБВГДЕЖЗИЙКЛМНОПРСТУФХЦЧШЩЪЫЬЭЮЯабвгдежзийклмнопрстуфхцчшщъыьэюяЁё'
          for file in ('EpilepsySans.ttf',):
              cmap=TTFont(str(Path('app/src/main/assets')/file)).getBestCmap()
              missing=''.join(ch for ch in required if ord(ch) not in cmap)
              if missing: raise RuntimeError(file+' missing: '+missing)
              print(file, 'Latin and Russian letters: OK; total Unicode characters',len(cmap))
          PY
      - name: Use Epilepsy Sans throughout the game
        run: |
          python3 tools/apply_epilepsy_font.py
          grep -q 'EpilepsySans.ttf' app/src/main/java/ru/pgws/pocketpet/PixelFont.java
          grep -q 'EpilepsySans.ttf' app/src/main/java/ru/pgws/pocketpet/MemorialCard.java
      - name: Run existing Java regression tests
        run: |
          set -euo pipefail
          mkdir -p /tmp/pet-tests
          javac -encoding UTF-8 -d /tmp/pet-tests \
            app/src/main/java/ru/pgws/pocketpet/{PetGame,PetSprites,MiniGames,TouchRegions,Lessons}.java \
            localtest/{TestPets,TestMiniGames,TestLifecycle,TestInteractionV7,TestLessons}.java
          for t in TestPets TestMiniGames TestLifecycle TestInteractionV7 TestLessons; do
            java -cp /tmp/pet-tests "$t"
          done
      - name: Build signed APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Validate APK and package complete source
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          unzip -tq "$APK"
          test -s "$APK"
          unzip -Z1 "$APK" | grep -F 'assets/EpilepsySans.ttf'
          unzip -Z1 "$APK" | grep -F 'assets/EpilepsySans-LICENSE.txt'
          ! unzip -Z1 "$APK" | grep -F 'LCD5x8H.ttf'
          sha256sum "$APK"
          zip -q -r PocketPet96-v8.1-EpilepsySans-source.zip \
            README.md settings.gradle build.gradle gradle.properties app/src app/build.gradle \
            localtest tools -x '*.pyc'
      - uses: actions/upload-artifact@v4
        with:
          name: PocketPet96-v8.1-EpilepsySans-APK
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: PocketPet96-v8.1-EpilepsySans-Source
          path: PocketPet96-v8.1-EpilepsySans-source.zip
          retention-days: 30
